name: Parser (latest)

on:
  workflow_dispatch:

concurrency:
  group: peach-pipeline-db
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Apply DB migrations
        env:
          SHOTIBLOF_GITHUB_TOKEN: ${{ secrets.SHOTIBLOF_GITHUB_TOKEN }}
          PIPELINE_DB_GITHUB_REPO: shotiblof/peach-pipeline-db
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        working-directory: worker
        run: python apply_migrations.py

      - name: Run ebalka parser (latest)
        env:
          SHOTIBLOF_GITHUB_TOKEN: ${{ secrets.SHOTIBLOF_GITHUB_TOKEN }}
          PIPELINE_DB_GITHUB_REPO: shotiblof/peach-pipeline-db
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PARSER_MODE: latest
          PARSER_MAX_PARSED_QUEUE: "120"
          PIPELINE_PROFILE: hyper
        working-directory: worker
        run: python run_catalog_parser.py
